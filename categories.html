---
layout: default
title: Categories
permalink: /categories/
---
<h1 class="page-title">Categories</h1>
{% assign cats = site.categories | sort %}
{% for c in cats %}
<h2 class="archive-heading" id="{{ c[0] | slugify: 'unicode' }}">{{ c[0] }}</h2>
<ul class="archive-list">
  {% for p in c[1] %}
  <li><span class="archive-date">{{ p.date | date: "%b %-d, %Y" }}</span> <a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>아직 카테고리가 없습니다.</p>
{% endfor %}
